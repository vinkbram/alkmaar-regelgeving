{% extends "base.html" %}
{% block title %}Alle tags — Regelgeving Alkmaar{% endblock %}
{% block content %}
<h1>Alle tags</h1>
<p>{{ tags|length }} tags toegekend aan artikelen.</p>
<div class="tag-cloud">
    {% for t in tags %}
    <a href="/tag/{{ t.id }}" class="tag">{{ t.label }} <span class="tag-count">({{ t.cnt }})</span></a>
    {% endfor %}
</div>
{% endblock %}
